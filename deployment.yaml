apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-control-plane
  labels: {app.kubernetes.io/name: tenant-control-plane, app.kubernetes.io/part-of: pathops}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: tenant-control-plane}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tenant-control-plane, app.kubernetes.io/part-of: pathops}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tenant-control-plane
          image: tenant-control-plane
          env:
            - {name: LISTEN_ADDRESS, value: ":8080"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
