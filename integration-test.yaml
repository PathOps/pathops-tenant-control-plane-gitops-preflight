            - {name: CP_REQUIRE_LOGIN, value: "1"}
            - {name: CP_LOGIN_USERNAME, valueFrom: {secretKeyRef: {name: tenant-cp-preflight-login, key: username}}}
            - {name: CP_LOGIN_PASSWORD, valueFrom: {secretKeyRef: {name: tenant-cp-preflight-login, key: password}}}
            - {name: CP_OIDC_CA_FILE, value: /etc/pathops/cell-ca/ca.crt}
          volumeMounts: [{name: cell-ca, mountPath: /etc/pathops/cell-ca, readOnly: true}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      volumes: [{name: cell-ca, configMap: {name: tenant-control-plane-cell-ca}}]
