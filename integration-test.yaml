# One integration-test run, written by PREPARE_PREFLIGHT_TESTS (tenant-control-plane-run-preflight-tests-4mrbm).
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant-control-plane-run-preflight-tests-4mrbm
  labels: {app.kubernetes.io/name: tenant-control-plane-tests, pathops.io/source-revision: "cbd31aa3bd76"}
  annotations: {pathops.io/source-commit: "cbd31aa3bd7641312df5c1db6d3a06bd4a318e8b", pathops.io/tests-digest: "sha256:d3a8d0a9e2158d4fe58d3982e4820f3234844b5fc47b8c676f0c098fe6f11469"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: tenant-control-plane-tests}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tests
          image: tenant-control-plane-integration-tests
          env:
            - {name: CP_BASE_URL, value: "http://tenant-control-plane.pathops-tenant-control-plane-preflight.svc.cluster.local:8080"}
            - {name: CP_HEALTH_PATH, value: "/healthz"}
            - {name: CP_REQUIRE_LOGIN, value: "1"}
            - {name: CP_LOGIN_USERNAME, valueFrom: {secretKeyRef: {name: tenant-cp-preflight-login, key: username}}}
            - {name: CP_LOGIN_PASSWORD, valueFrom: {secretKeyRef: {name: tenant-cp-preflight-login, key: password}}}
            - {name: CP_OIDC_CA_FILE, value: /etc/pathops/cell-ca/ca.crt}
          volumeMounts: [{name: cell-ca, mountPath: /etc/pathops/cell-ca, readOnly: true}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      volumes: [{name: cell-ca, configMap: {name: tenant-control-plane-cell-ca}}]
