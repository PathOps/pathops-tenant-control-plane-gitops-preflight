# One integration-test run, written by PREPARE_PREFLIGHT_TESTS (tenant-control-plane-run-preflight-tests-2lm7r).
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant-control-plane-run-preflight-tests-2lm7r
  labels: {app.kubernetes.io/name: tenant-control-plane-tests, pathops.io/source-revision: "70af22a8e2ac"}
  annotations: {pathops.io/source-commit: "70af22a8e2ac2d9f3d2a9aaaf24358d835f32a6d", pathops.io/tests-digest: "sha256:4c8dc64d1185f2ef3d2c75dd013d2a6de7ff6a0ff5f297be77eb7e7c74065dad"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: tenant-control-plane-tests}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tests
          image: tenant-control-plane-integration-tests
          env:
            - {name: CP_BASE_URL, value: "http://tenant-control-plane.pathops-tenant-control-plane-preflight.svc.cluster.local:8080"}
