# One integration-test run, written by PREPARE_PREFLIGHT_TESTS (tenant-control-plane-run-preflight-tests-ncnrk).
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant-control-plane-run-preflight-tests-ncnrk
  labels: {app.kubernetes.io/name: tenant-control-plane-tests, pathops.io/source-revision: "45afbc82f98b"}
  annotations: {pathops.io/source-commit: "45afbc82f98b199dd870619efb92746730c61465", pathops.io/tests-digest: "sha256:fd28c27c1210123189819a80aed17c02bf87504cddab7e3a2a9bfe749c009a4e"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: tenant-control-plane-tests}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tests
          image: tenant-control-plane-integration-tests
          env:
            - {name: CP_BASE_URL, value: "http://tenant-control-plane.pathops-tenant-control-plane-preflight.svc.cluster.local:8080"}
            - {name: CP_HEALTH_PATH, value: "/healthz"}
            - {name: CP_REQUIRE_LOGIN, value: "1"}
            - {name: CP_LOGIN_USERNAME, valueFrom: {secretKeyRef: {name: tenant-cp-preflight-login, key: username}}}
            - {name: CP_LOGIN_PASSWORD, valueFrom: {secretKeyRef: {name: tenant-cp-preflight-login, key: password}}}
            - {name: CP_OIDC_CA_FILE, value: /etc/pathops/cell-ca/ca.crt}
          volumeMounts: [{name: cell-ca, mountPath: /etc/pathops/cell-ca, readOnly: true}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      volumes: [{name: cell-ca, configMap: {name: tenant-control-plane-cell-ca}}]
