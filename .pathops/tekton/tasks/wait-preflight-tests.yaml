# WAIT_PREFLIGHT_TESTS (Decision 0051): observe the integration-test run that
# Flux materialized: wait for the Job, check its Pod ran exactly the test image
# digest built for the candidate, print its log and fail unless it completed.
# Read-only.
apiVersion: tekton.dev/v1
kind: Task
metadata: {name: wait-preflight-tests}
spec:
  params:
    - {name: NAMESPACE, default: pathops-tenant-control-plane-preflight}
    - {name: JOB_NAME}
    - {name: TESTS_DIGEST}
  results:
    - {name: STATUS, description: "passed (the Task fails otherwise)"}
  steps:
    - name: wait
      image: docker.io/alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      env: [{name: HOME, value: /tmp}]
      script: |
        #!/bin/sh
        set -eu
        ns=$(params.NAMESPACE); job=$(params.JOB_NAME)
        i=0
        while :; do
          state=$(kubectl -n "$ns" get job "$job" -o json 2>/dev/null \
            | jq -r '[.status.conditions[]? | select(.status == "True") | .type] | if index("Complete") then "Complete" elif index("Failed") then "Failed" else "Running" end' \
            || echo Missing)
          case "$state" in Complete | Failed) break ;; esac
          i=$((i + 1))
          [ "$i" -le 120 ] || { echo "test Job $ns/$job did not finish (state: $state)"; exit 1; }
          sleep 5
        done
        kubectl -n "$ns" logs "job/$job" --tail=200 || true
        image_ids=$(kubectl -n "$ns" get pods -l "job-name=$job" -o jsonpath='{range .items[*]}{.status.containerStatuses[0].imageID}{"\n"}{end}')
        [ -n "$image_ids" ] && ! printf '%s\n' "$image_ids" | grep -vq "@$(params.TESTS_DIGEST)$" \
          || { echo "test Job $ns/$job did not run the test image $(params.TESTS_DIGEST): $image_ids"; exit 1; }
        [ "$state" = Complete ] || { echo "test Job $ns/$job failed"; exit 1; }
        printf passed > "$(results.STATUS.path)"
        echo "test Job $ns/$job passed (test image $(params.TESTS_DIGEST))"
