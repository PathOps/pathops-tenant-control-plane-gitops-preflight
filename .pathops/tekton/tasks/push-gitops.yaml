# PUSH_GITOPS (Decision 0051): a StepAction used by the Tasks that change this
# repository. It commits the change prepared in /work/gitops with the message
# in /work/message and pushes it to main with the repository's own write
# deploy key (never forced: a concurrent change fails the run closed). With
# nothing to commit it pushes nothing. Result COMMIT: the GitOps commit that
# holds the desired state (HEAD).
apiVersion: tekton.dev/v1beta1
kind: StepAction
metadata: {name: push-gitops}
spec:
  results:
    - {name: COMMIT, description: GitOps commit holding the desired state}
  image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
  securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
  env: [{name: HOME, value: /tmp}]
  volumeMounts:
    - {name: gitops, mountPath: /work}
    - {name: gitops-key, mountPath: /pathops/key, readOnly: true}
  script: |
    #!/bin/sh
    set -eu
    cd /work/gitops
    git add -A
    if git diff --cached --quiet; then
      echo "desired state unchanged; nothing to commit"
    else
      git -c user.name="PathOps bootstrap pipeline" -c user.email="bootstrap-pipeline@demo.pathops.io" commit --quiet -F /work/message
      install -m 0600 /pathops/key/identity /tmp/git-identity
      GIT_SSH_COMMAND="ssh -i /tmp/git-identity -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/pathops/key/known_hosts" \
        git push --quiet origin HEAD:main
    fi
    git log -1 --format='%H %s'
    printf '%s' "$(git rev-parse HEAD)" > "$(step.results.COMMIT.path)"
