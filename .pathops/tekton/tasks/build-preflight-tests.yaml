# BUILD_PREFLIGHT_TESTS image build (Decisions 0051, 0052): build the
# integration-test image of the candidate under test (test/integration/Dockerfile
# of the source) with rootless BuildKit and create its immutable tag
# <zot>/pathops/tenant-control-plane-integration-tests:<IMAGE_REVISION>.
#
# Owned by the preflight stage, which needs it (RUN_PREFLIGHT_TESTS requests it);
# it runs in the build namespace with the BUILD execution role, assigned by the
# creator of its PipelineRun (the TriggerTemplate in ../triggers/preflight.yaml),
# as tenant-control-plane-test-build: source read, test-image create and build
# cache update in zot; no GitOps authority.
#
#   clone  current source main, inside the BUILD Pod; HEAD must be the
#          candidate's commit (COMMIT) and the one CLONE_SOURCE saw (CLONED):
#          a newer source HEAD fails closed (no old candidate tested with new
#          tests), and no historical checkout is made
#   auth   short-lived zot credential (Dex token exchange of the projected
#          ServiceAccount token)
#   build  BuildKit with the registry caches (the source build's included)
#   push   create the test-image tag once or adopt it if built from COMMIT;
#          never overwritten; then export its cache
apiVersion: tekton.dev/v1
kind: Task
metadata: {name: build-preflight-tests}
spec:
  params:
    - {name: COMMIT, description: full source commit of the candidate under test}
    - {name: CLONED, description: the source HEAD CLONE_SOURCE saw}
    - {name: IMAGE_REVISION, description: "first 12 hex characters of COMMIT: the candidate tag"}
    - {name: SOURCE_REPO, default: pathops/pathops-tenant-control-plane}
    - {name: REPO, default: pathops/tenant-control-plane-integration-tests, description: test-image repository in the Cell zot}
    - {name: DOCKERFILE, default: test/integration/Dockerfile, description: "Dockerfile in the source; the context is the repository root"}
    - {name: CACHE, default: "pathops/cache/tenant-control-plane:integration-tests", description: "the cache tag this build exports"}
    - {name: IMPORT_CACHES, default: "pathops/cache/tenant-control-plane:buildkit pathops/cache/tenant-control-plane:integration-tests", description: "cache tags imported (missing ones are skipped)"}
  results:
    - {name: DIGEST, description: "OCI digest of the test-image tag"}
    - {name: ADOPTED, description: "true if the test-image tag already existed for COMMIT and was reused"}
    - {name: CACHE, description: "exported | failed"}
  volumes:
    - {name: src, emptyDir: {}}
    - {name: out, emptyDir: {}}
    - {name: storage, emptyDir: {}}
    - {name: auth, emptyDir: {}}
    - {name: tmp-push, emptyDir: {}}
    - {name: subid, configMap: {name: userns-subid}}
    - {name: cell-ca, configMap: {name: cell-ca}}
    - {name: source-key, secret: {secretName: tenant-cp-source-read, defaultMode: 0440}}
    - name: sa-token
      projected:
        sources:
          - serviceAccountToken: {audience: "${STS_AUDIENCE}", expirationSeconds: 600, path: token}
  steps:
    - name: clone
      image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
      # group 65532 = the BUILD Pod fsGroup, so the deploy key (0440) is readable
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65532, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      env: [{name: HOME, value: /tmp}]
      volumeMounts:
        - {name: src, mountPath: /work}
        - {name: source-key, mountPath: /pathops/source-key, readOnly: true}
      script: |
        #!/bin/sh
        set -eu
        install -m 0600 /pathops/source-key/identity /tmp/git-identity
        export GIT_SSH_COMMAND="ssh -i /tmp/git-identity -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/pathops/source-key/known_hosts"
        git clone --quiet --depth 1 --branch main "ssh://git@forgejo.scm.svc.cluster.local:2222/$(params.SOURCE_REPO).git" /work/src
        head=$(git -C /work/src rev-parse HEAD)
        [ "$(params.CLONED)" = "$(params.COMMIT)" ] && [ "$head" = "$(params.COMMIT)" ] \
          || { echo "source HEAD is $head (CLONE_SOURCE saw $(params.CLONED)), not the candidate $(params.COMMIT): no tests of a newer source for an older candidate; fails closed"; exit 1; }
        [ "$(params.IMAGE_REVISION)" = "$(printf '%s' "$head" | cut -c1-12)" ] || { echo "revision $(params.IMAGE_REVISION) is not derived from $head"; exit 1; }
        chmod -R a+rX /work/src
        echo "building $head"
    - name: auth
      image: quay.io/skopeo/stable:v1.20.0@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4
      securityContext: &plain {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      env: [{name: HOME, value: /tmp}]
      volumeMounts:
        - {name: auth, mountPath: /auth}
        - {name: cell-ca, mountPath: /etc/pathops/registry-ca, readOnly: true}
        - {name: sa-token, mountPath: /var/run/secrets/pathops, readOnly: true}
      script: |
        #!/bin/sh
        set -eu
        # RFC 8693 token exchange at the Cell's Dex: public audience client "zot",
        # no client secret, no static registry credential; lifetime <= 300 s.
        TOK=$(curl -sS --fail-with-body --cacert /etc/pathops/registry-ca/ca.crt \
          -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange -d client_id=zot -d connector_id=k8s-cell \
          -d "scope=openid federated:id" -d subject_token_type=urn:ietf:params:oauth:token-type:id_token \
          -d requested_token_type=urn:ietf:params:oauth:token-type:access_token \
          --data-urlencode subject_token@/var/run/secrets/pathops/token https://${DEX_HOST}/token \
          | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        [ -n "$TOK" ] || { echo "no workload token"; exit 1; }
        printf '{"auths":{"%s":{"auth":"%s"}}}' "${ZOT_HOST}" "$(printf 'oidc:%s' "$TOK" | base64 -w0)" > /auth/config.json
        printf '[registry."%s"]\n  ca = ["/etc/pathops/registry-ca/ca.crt"]\n' "${ZOT_HOST}" > /auth/buildkitd.toml
        chmod 0644 /auth/config.json /auth/buildkitd.toml
        echo "zot credential for the cache import obtained"
    - name: build
      image: docker.io/moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: true
        capabilities: {add: [SETUID, SETGID, SYS_CHROOT], drop: [ALL]}
        seccompProfile: {type: Localhost, localhostProfile: pathops-userns-builder-v1.json}
        appArmorProfile: {type: Localhost, localhostProfile: pathops-rootless-builder}
      env:
        - {name: HOME, value: /home/user}
        - {name: DOCKER_CONFIG, value: /auth}
        - {name: BUILDKITD_FLAGS, value: "--oci-worker-no-process-sandbox --root /storage/buildkit --config /auth/buildkitd.toml"}
        - {name: BUILDKITD_READY_SECONDS, value: "60"}
      computeResources:
        requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
        limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 8Gi}
      volumeMounts:
        - {name: src, mountPath: /work, readOnly: true}
        - {name: out, mountPath: /out}
        - {name: storage, mountPath: /storage}
        - {name: auth, mountPath: /auth, readOnly: true}
        - {name: cell-ca, mountPath: /etc/pathops/registry-ca, readOnly: true}
        - {name: subid, mountPath: /etc/subuid, subPath: subuid}
        - {name: subid, mountPath: /etc/subgid, subPath: subgid}
      script: |
        #!/bin/sh
        set -eu
        df="$(params.DOCKERFILE)"
        case "$df" in /* | *..*) echo "DOCKERFILE must be a relative path inside the repository: $df"; exit 1 ;; esac
        [ -f "/work/src/$df" ] || { echo "no $df in the source"; exit 1; }
        # A rootless buildkitd for this step, waited for explicitly (at most
        # BUILDKITD_READY_SECONDS while it runs); a daemon that exits fails at once.
        tmp=$(mktemp -d)
        addr=unix://$XDG_RUNTIME_DIR/buildkit/buildkitd.sock
        { rootlesskit buildkitd $BUILDKITD_FLAGS --addr="$addr" >"$tmp/log" 2>&1 &
          echo "$!" >"$tmp/pid"
          wait "$!" && rc=0 || rc=$?
          echo "$rc" >"$tmp/exit"; } 2>/dev/null &
        trap 'kill "$(cat "$tmp/pid" 2>/dev/null)" 2>/dev/null || true' EXIT
        start=$(date +%s)
        until buildctl --addr="$addr" debug workers >/dev/null 2>&1; do
          if [ -e "$tmp/exit" ]; then echo "buildkitd exited (status $(cat "$tmp/exit")); its log:" >&2; cat "$tmp/log" >&2; exit 1; fi
          if [ $(($(date +%s) - start)) -ge "$BUILDKITD_READY_SECONDS" ]; then echo "buildkitd did not start; its log:" >&2; cat "$tmp/log" >&2; exit 1; fi
          sleep 0.2
        done
        imports=""
        for c in $(params.IMPORT_CACHES); do imports="$imports --import-cache type=registry,ref=${ZOT_HOST}/$c"; done
        # shellcheck disable=SC2086  # one --import-cache per cache tag
        buildctl --addr="$addr" build --frontend dockerfile.v0 \
          --local context=/work/src --local "dockerfile=/work/src/$(dirname "$df")" --opt "filename=$(basename "$df")" \
          --opt "label:org.opencontainers.image.revision=$(params.COMMIT)" --opt "label:org.opencontainers.image.version=$(params.IMAGE_REVISION)" \
          $imports --export-cache type=local,dest=/out/cache,mode=max,image-manifest=true,oci-mediatypes=true \
          --output type=oci,dest=/out/image.tar
    - name: push
      image: quay.io/skopeo/stable:v1.20.0@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4
      securityContext: *plain
      env:
        - {name: HOME, value: /tmp}
        - {name: REGISTRY_AUTH_FILE, value: /tmp/auth.json}
      volumeMounts:
        - {name: out, mountPath: /out, readOnly: true}
        - {name: cell-ca, mountPath: /etc/pathops/registry-ca, readOnly: true}
        - {name: sa-token, mountPath: /var/run/secrets/pathops, readOnly: true}
        - {name: tmp-push, mountPath: /tmp}
      script: |
        #!/bin/sh
        set -eu
        TOK=$(curl -sS --fail-with-body --cacert /etc/pathops/registry-ca/ca.crt \
          -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange -d client_id=zot -d connector_id=k8s-cell \
          -d "scope=openid federated:id" -d subject_token_type=urn:ietf:params:oauth:token-type:id_token \
          -d requested_token_type=urn:ietf:params:oauth:token-type:access_token \
          --data-urlencode subject_token@/var/run/secrets/pathops/token https://${DEX_HOST}/token \
          | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        [ -n "$TOK" ] || { echo "no workload token"; exit 1; }
        printf '%s' "$TOK" | skopeo login --cert-dir /etc/pathops/registry-ca -u oidc --password-stdin ${ZOT_HOST} >/dev/null
        commit=$(params.COMMIT); rev=$(params.IMAGE_REVISION)
        printf '%s' "$rev" | grep -Eqx '[0-9a-f]{12}' || { echo "not a 12-character image revision: $rev"; exit 1; }
        ref="${ZOT_HOST}/$(params.REPO):$rev"
        # Create-only (Decision 0043; zot also denies the update): an existing
        # tag is adopted only if it was built from this commit.
        if skopeo inspect --cert-dir /etc/pathops/registry-ca --config "docker://$ref" > /tmp/config.json 2>/dev/null; then
          label=$(sed -n 's/.*"org.opencontainers.image.revision":"\([0-9a-f]*\)".*/\1/p' /tmp/config.json)
          [ "$label" = "$commit" ] || { echo "artifact-integrity: $ref exists, built from '$label', not $commit; never overwritten"; exit 1; }
          adopted=true
          echo "$ref already exists for $commit: adopted, not rebuilt over"
        else
          skopeo copy --dest-cert-dir /etc/pathops/registry-ca oci-archive:/out/image.tar "docker://$ref"
          adopted=false
        fi
        digest=$(skopeo inspect --cert-dir /etc/pathops/registry-ca --format '{{.Digest}}' "docker://$ref" | tr -d '\n')
        printf '%s' "$digest" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "bad digest: $digest"; exit 1; }
        printf '%s' "$digest" > "$(results.DIGEST.path)"
        printf '%s' "$adopted" > "$(results.ADOPTED.path)"
        echo "test image $ref = $digest (adopted=$adopted)"
        # The build cache: mutable implementation cache, never the test image.
        if skopeo copy --dest-cert-dir /etc/pathops/registry-ca oci:/out/cache:latest "docker://${ZOT_HOST}/$(params.CACHE)"; then
          printf exported > "$(results.CACHE.path)"; echo "cache exported to ${ZOT_HOST}/$(params.CACHE)"
        else
          printf failed > "$(results.CACHE.path)"; echo "WARN: cache export to ${ZOT_HOST}/$(params.CACHE) failed; the test image is unaffected"
        fi
